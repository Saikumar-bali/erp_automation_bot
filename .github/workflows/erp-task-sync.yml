name: ERP Fleet Task Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use 1 for validation/dry run, 0 to create/update ERP tasks"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      project_search:
        description: "Project search text if ERP_PROJECT secret is not exact"
        required: false
        default: "FLEET"
        type: string
      create_project_if_missing:
        description: "Use 1 only if the ERP Project should be created when missing"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

jobs:
  sync-fleet-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Fleet ERP update file
        shell: bash
        env:
          INPUT_FILE: data/fleet_erp_updates.json
        run: |
          node scripts/validate_fleet_erp_updates.mjs

      - name: Sync Fleet timeline tasks into ERP
        shell: bash
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USERNAME }}
          ERP_PASS: ${{ secrets.ERP_PASSWORD }}
          ERP_PROJECT: ${{ secrets.ERP_PROJECT }}
          PROJECT_SEARCH: ${{ inputs.project_search }}
          CREATE_PROJECT_IF_MISSING: ${{ inputs.create_project_if_missing }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FILE: data/fleet_erp_updates.json
        run: |
          if [ "$DRY_RUN" = "1" ] && { [ -z "$ERP_USER" ] || [ -z "$ERP_PASS" ]; }; then
            echo "Dry-run validation passed. ERP credentials are missing, so ERP connectivity is skipped."
            echo "Set ERP_USERNAME and ERP_PASSWORD secrets before running dry_run=0."
            exit 0
          fi

          if [ -z "$ERP_USER" ] || [ -z "$ERP_PASS" ]; then
            echo "ERP_USERNAME and ERP_PASSWORD GitHub Secrets are required for dry_run=0. Do not commit credentials."
            exit 1
          fi

          node scripts/frappe_erp_git_task_sync.mjs

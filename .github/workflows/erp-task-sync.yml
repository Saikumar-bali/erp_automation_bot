name: ERP Fleet Task Sync

on:
  push:
    branches:
      - master
    paths:
      - data/fleet_erp_updates.json
      - scripts/frappe_erp_git_task_sync.mjs
      - scripts/validate_fleet_erp_updates.mjs
      - .github/workflows/erp-task-sync.yml
      - docs/ERP_FLEET_TASK_SYNC.md
      - package.json
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose sync_to_erp to create/update tasks, or validate_only to only print the plan"
        required: true
        default: "sync_to_erp"
        type: choice
        options:
          - "sync_to_erp"
          - "validate_only"
      project_search:
        description: "Project search text if ERP_PROJECT secret is not exact"
        required: false
        default: "FLEET"
        type: string
      create_project_if_missing:
        description: "Use 1 only if the ERP Project should be created when missing"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

jobs:
  sync-fleet-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and print Fleet ERP update plan
        shell: bash
        env:
          INPUT_FILE: data/fleet_erp_updates.json
        run: |
          node scripts/validate_fleet_erp_updates.mjs

      - name: Push CI ERP dry-run diagnostic
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USERNAME }}
          ERP_PASS: ${{ secrets.ERP_PASSWORD }}
          ERP_PROJECT: ${{ secrets.ERP_PROJECT }}
          PROJECT_SEARCH: FLEET
          CREATE_PROJECT_IF_MISSING: "0"
          DRY_RUN: "1"
          INPUT_FILE: data/fleet_erp_updates.json
        run: |
          echo "Push CI mode: validating payload + ERP login/project/task-read dry run only. No ERP writes will be made."
          if [ -z "$ERP_USER" ] || [ -z "$ERP_PASS" ]; then
            echo "Root cause: ERP_USERNAME and ERP_PASSWORD GitHub Secrets are required for push CI diagnostics."
            exit 1
          fi
          node scripts/frappe_erp_git_task_sync.mjs

      - name: Stop after validation only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_only' }}
        shell: bash
        run: |
          echo "mode=validate_only selected. Validation and task timeline print completed. No ERP login/API calls were made."

      - name: Sync Fleet timeline tasks into ERP
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync_to_erp' }}
        shell: bash
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USERNAME }}
          ERP_PASS: ${{ secrets.ERP_PASSWORD }}
          ERP_PROJECT: ${{ secrets.ERP_PROJECT }}
          PROJECT_SEARCH: ${{ inputs.project_search }}
          CREATE_PROJECT_IF_MISSING: ${{ inputs.create_project_if_missing }}
          DRY_RUN: "0"
          INPUT_FILE: data/fleet_erp_updates.json
        run: |
          if [ -z "$ERP_USER" ] || [ -z "$ERP_PASS" ]; then
            echo "ERP_USERNAME and ERP_PASSWORD GitHub Secrets are required for sync_to_erp. Do not commit credentials."
            exit 1
          fi

          node scripts/frappe_erp_git_task_sync.mjs
